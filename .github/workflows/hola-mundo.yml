
name: Mi primer workflow

on:
  push:

jobs:
  ejecutar-python:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Ejecutar archivo Python
        run: python hello-world.py
